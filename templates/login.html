{% extends "base.html" %}
{% block auth_content %}
<div class="auth-card card animate-fade-in">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="color: var(--primary); margin-bottom: 0.5rem;"><i class="fa-solid fa-layer-group"></i> Project PA</h1>
        <p style="color: var(--text-muted);">Sign in to your account</p>
    </div>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div style="margin-bottom: 1.5rem;">
            <label for="email" style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Login</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Sign Up</a>
    </p>
</div>
{% endblock %}
