{% extends "base.html" %}
{% block auth_content %}
<div class="auth-card animate-fade-in">
    <div style="text-align:center; margin-bottom:2rem;">
        <div style="display:inline-flex; align-items:center; gap:0.6rem; margin-bottom:1.25rem; text-decoration:none;" href="{{ url_for('index') }}">
            <div class="sidebar-logo-icon" style="width:44px; height:44px; font-size:1.2rem;"><i class="fa-solid fa-bolt"></i></div>
            <div>
                <div style="font-size:1.2rem; font-weight:800; letter-spacing:-0.02em; color:var(--text-main);">Project PA</div>
                <div style="font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em;">Discipline Intelligence</div>
            </div>
        </div>
        <h2 style="font-size:1.5rem; font-weight:700; margin-bottom:0.35rem;">Welcome back</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;">Sign in to continue your discipline journey.</p>
    </div>

    <div class="auth-glass">
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="email"><i class="fa-solid fa-envelope" style="margin-right:0.4rem;"></i> Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password"><i class="fa-solid fa-lock" style="margin-right:0.4rem;"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem; font-size:1rem; margin-top:0.5rem;">
                Sign In <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p style="text-align:center; margin-top:1.5rem; font-size:0.88rem; color:var(--text-muted);">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" style="color:var(--primary); font-weight:600; text-decoration:none;">Create one free</a>
        </p>
    </div>
</div>
{% endblock %}
